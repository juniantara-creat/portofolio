<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | I Gede Juni Antara</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">My Portfolio</h1>

            <div class="hidden md:flex gap-6">
                <a href="index.html" class="hover:text-blue-400">Home</a>
                <a href="about.html" class="hover:text-blue-400">About</a>
                <a href="projects.html" class="hover:text-blue-400">Projects</a>
                <a href="contact.html" class="text-blue-400">Contact</a>
            </div>

            <button id="menuBtn" class="md:hidden text-2xl">
                ☰
            </button>
        </div>

        <div id="mobileMenu" class="hidden md:hidden px-6 pb-4">
            <a href="index.html" class="block py-2">Home</a>
            <a href="about.html" class="block py-2">About</a>
            <a href="projects.html" class="block py-2">Projects</a>
            <a href="contact.html" class="block py-2 text-blue-400">Contact</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-16">

        <!-- Contact -->
        <h2 class="text-4xl font-bold text-center mb-12">
            Hubungi Saya
        </h2>

        <div class="grid md:grid-cols-2 gap-10">

            <div>
                <h3 class="text-2xl font-bold mb-4">
                    Contact Form
                </h3>

                <form id="contactForm" class="bg-white p-6 rounded-xl shadow">

                    <label class="block font-semibold mb-2">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan nama"
                    >

                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan email"
                    >

                    <label class="block font-semibold mb-2">
                        Pesan
                    </label>

                    <textarea
                        id="pesan"
                        rows="5"
                        class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Tulis pesan..."
                    ></textarea>

                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
                        Kirim Pesan
                    </button>

                    <p id="formMessage" class="mt-4 text-center"></p>

                </form>
            </div>


            <!-- Kalkulator Nilai -->
            <div>
                <h3 class="text-2xl font-bold mb-4">
                    Tugas JavaScript
                </h3>

                <div class="bg-white p-6 rounded-xl shadow">

                    <h4 class="text-xl font-bold mb-6">
                        Kalkulator Nilai Mahasiswa
                    </h4>

                    <label class="block font-semibold mb-2">
                        Nama Mahasiswa
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        class="w-full border rounded-lg px-4 py-3 mb-4"
                        placeholder="Nama mahasiswa"
                    >

                    <label class="block font-semibold mb-2">
                        Nilai Tugas
                    </label>

                    <input
                        type="number"
                        id="nilaiTugas"
                        min="0"
                        max="100"
                        class="w-full border rounded-lg px-4 py-3 mb-4"
                        placeholder="0 - 100"
                    >

                    <label class="block font-semibold mb-2">
                        Nilai UTS
                    </label>

                    <input
                        type="number"
                        id="nilaiUts"
                        min="0"
                        max="100"
                        class="w-full border rounded-lg px-4 py-3 mb-4"
                        placeholder="0 - 100"
                    >

                    <label class="block font-semibold mb-2">
                        Nilai UAS
                    </label>

                    <input
                        type="number"
                        id="nilaiUas"
                        min="0"
                        max="100"
                        class="w-full border rounded-lg px-4 py-3 mb-5"
                        placeholder="0 - 100"
                    >

                    <button
                        onclick="hitungNilai()"
                        class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700">
                        Hitung Nilai
                    </button>

                    <!-- Hasil -->
                    <div id="hasilNilai"
                         class="hidden mt-6 bg-slate-100 rounded-lg p-5">

                        <h4 class="font-bold text-lg mb-3">
                            Hasil Perhitungan
                        </h4>

                        <p id="hasilNama"></p>
                        <p id="hasilAkhir"></p>
                        <p id="hasilGrade"></p>
                        <p id="hasilStatus"></p>

                    </div>

                </div>
            </div>

        </div>

    </main>

    <footer class="bg-slate-900 text-white text-center py-6">
        <p>&copy; 2026 I Gede Juni Antara. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
